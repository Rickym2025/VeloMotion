<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloMotion | Pannello Attivazione Sblocco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
        .neon-border { border: 1px solid rgba(6, 182, 212, 0.2); box-shadow: 0 0 15px rgba(6, 182, 212, 0.1); }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full glass-panel rounded-2xl p-8 neon-border text-center space-y-6">
        <h2 class="text-2xl font-bold text-white" style="font-family: 'Outfit';">VELO<span class="text-cyan-400">MOTION</span></h2>
        
        <div id="loading" class="text-gray-400 py-6">Recupero codice licenza in corso...</div>

        <div id="content" class="hidden space-y-6">
            <div>
                <span class="text-xs text-gray-500 uppercase block tracking-wider">Bicicletta Cliente</span>
                <span id="nome-cliente" class="text-xl font-bold text-white block mt-1">-</span>
            </div>

            <div id="code-section" class="bg-slate-900 border border-gray-800 rounded-xl p-4 space-y-3">
                <span class="text-xs text-gray-500 uppercase block">Codice Licenza Sblocco</span>
                <div id="license-code" class="font-mono text-cyan-400 font-bold text-lg select-all tracking-wider">-</div>
                <button onclick="copyCode()" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 text-xs font-semibold px-4 py-2 rounded-lg border border-cyan-500/20 transition">
                    Copia Codice
                </button>
            </div>

            <div class="space-y-3">
                <p class="text-xs text-gray-500">
                    Collega il telefono alla bici, clicca sul pulsante sotto, incolla il codice nel portale ufficiale e procedi con lo sblocco.
                </p>
                <a href="https://ebts.unlocked.bike/" target="_blank" class="block w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-4 rounded-xl transition text-center" style="font-family: 'Outfit';">
                    Avvia Sblocco WebUSB
                </a>
            </div>
        </div>
        
        <div id="error-msg" class="hidden text-red-400 font-semibold py-6">
            Codice di sblocco non trovato o non ancora elaborato.
        </div>
    </div>

    <script>
        // Sostituisci con le tue chiavi reali di Supabase
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        // Estrai ID dalla barra indirizzi
        const urlParams = new URLSearchParams(window.location.search);
        const sbloccoId = urlParams.get('id');

        if (!sbloccoId) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-msg').innerText = "ID Sblocco mancante nell'URL.";
            document.getElementById('error-msg').classList.remove('hidden');
        } else {
            fetch(`${SUPABASE_URL}/rest/v1/velomotion_sblocchi?id=eq.${sbloccoId}`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                if (data && data.length > 0 && data[0].codice_licenza) {
                    document.getElementById('nome-cliente').innerText = data[0].nome_cliente;
                    document.getElementById('license-code').innerText = data[0].codice_licenza;
                    document.getElementById('content').classList.remove('hidden');
                } else {
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-msg').classList.remove('hidden');
            });
        }

        function copyCode() {
            const codeText = document.getElementById('license-code').innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                alert('Codice licenza copiato negli appunti!');
            });
        }
    </script>
</body>
</html>
