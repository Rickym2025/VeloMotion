<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloMotion | Area Officina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
        .neon-border { border: 1px solid rgba(6, 182, 212, 0.2); box-shadow: 0 0 15px rgba(6, 182, 212, 0.1); }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex items-center justify-center p-6">

    <!-- SCHERMATA LOGIN -->
    <div id="login-screen" class="max-w-md w-full glass-panel rounded-2xl p-8 neon-border text-center space-y-6">
        <h2 class="text-3xl font-bold text-white" style="font-family: 'Outfit';">VELO<span class="text-cyan-400">MOTION</span></h2>
        <p class="text-xs text-gray-400 uppercase tracking-widest">Accesso Riservato Officine</p>
        
        <div class="space-y-4">
            <div>
                <label for="token-input" class="block text-xs text-gray-500 uppercase mb-2 text-left">Inserisci Codice Accesso Officina</label>
                <input type="password" id="token-input" placeholder="Codice Officina..." class="w-full bg-slate-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-center font-mono text-lg">
            </div>
            <button onclick="handleLogin()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-4 rounded-xl transition font-outfit" style="font-family: 'Outfit';">
                Accedi alla Dashboard
            </button>
        </div>
        <p id="login-error" class="hidden text-red-400 text-sm font-semibold">Codice non valido. Riprova.</p>
    </div>

    <!-- SCHERMATA DASHBOARD (Nascosta inizialmente) -->
    <div id="dashboard-screen" class="hidden max-w-xl w-full glass-panel rounded-2xl p-8 neon-border space-y-6">
        
        <!-- Header Info Officina -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <div>
                <span class="text-xs text-gray-500 uppercase tracking-wider block">Officina Attiva</span>
                <span id="nome-officina" class="text-lg font-bold text-white block mt-0.5">-</span>
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-500 uppercase tracking-wider block">Crediti Residui</span>
                <span id="crediti-residui" class="text-2xl font-black text-emerald-400 block">-</span>
            </div>
        </div>

        <!-- Wizard di Check Semplificato per il Meccanico -->
        <div class="space-y-6">
            <h3 class="text-lg font-bold text-white text-center font-outfit">Avvia Nuovo Check Compatibilità</h3>
            
            <div class="space-y-4">
                <!-- Nome Cliente -->
                <div>
                    <label class="block text-xs text-gray-500 uppercase mb-2">Nome Cliente / Identificativo Bici</label>
                    <input type="text" id="nome-cliente-input" placeholder="Esempio: Bici di Mario" class="w-full bg-slate-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-center">
                </div>

                <!-- Selezione Magnete -->
                <div class="grid grid-cols-2 gap-4">
                    <button id="btn-magnete-raggi" onclick="setMagnete('raggi')" class="glass-panel border border-gray-800 p-4 rounded-xl font-bold text-sm text-center transition">
                        Magnete su Raggi
                    </button>
                    <button id="btn-magnete-valvola" onclick="setMagnete('valvola')" class="glass-panel border border-gray-800 p-4 rounded-xl font-bold text-sm text-center transition">
                        Magnete su Valvola
                    </button>
                </div>

                <!-- Selezione Display -->
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-disp-purion" onclick="setDisplay('Purion 200')" class="glass-panel border border-gray-800 py-3 rounded-lg text-xs font-semibold text-center transition">Purion 200</button>
                    <button id="btn-disp-kiox" onclick="setDisplay('Kiox 300/500')" class="glass-panel border border-gray-800 py-3 rounded-lg text-xs font-semibold text-center transition">Kiox 300/500</button>
                    <button id="btn-disp-intuvia" onclick="setDisplay('Intuvia 100')" class="glass-panel border border-gray-800 py-3 rounded-lg text-xs font-semibold text-center transition">Intuvia 100</button>
                    <button id="btn-disp-led" onclick="setDisplay('LED Remote')" class="glass-panel border border-gray-800 py-3 rounded-lg text-xs font-semibold text-center transition">LED Remote</button>
                </div>

                <!-- Versione Firmware -->
                <div>
                    <label class="block text-xs text-gray-500 uppercase mb-2">Versione Software Motore</label>
                    <input type="text" id="fw-input" placeholder="Esempio: 15.24.2" class="w-full bg-slate-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-center font-mono text-lg">
                </div>

                <button onclick="processCheck()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-4 rounded-xl transition font-outfit" style="font-family: 'Outfit';">
                    Esegui Verifica e Richiedi Sblocco
                </button>
            </div>
        </div>

        <!-- Risultato del Check (Nascosto inizialmente) -->
        <div id="check-result" class="hidden p-6 rounded-xl border text-center space-y-4">
            <h4 id="result-title" class="text-xl font-bold font-outfit"></h4>
            <p id="result-description" class="text-sm text-gray-300 leading-relaxed max-w-xl mx-auto"></p>
            <button id="btn-reset" onclick="resetCheck()" class="text-xs text-gray-400 hover:text-white transition underline">Esegui un altro check</button>
        </div>

        <button onclick="handleLogout()" class="text-xs text-gray-600 hover:text-gray-400 transition underline block mx-auto pt-4">Disconnetti Officina</button>
    </div>

    <script>
        // Sostituisci con le tue credenziali di Supabase
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        let officinaCorrente = null;
        let selectedMagnet = '';
        let selectedDisplay = '';

        // Controlla la sessione all'avvio
        window.onload = function() {
            const token = localStorage.getItem('rivenditore_token');
            if (token) {
                validaToken(token);
            }
        }

        function validaToken(token) {
            fetch(`${SUPABASE_URL}/rest/v1/rivenditori?access_token=eq.${token}`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    officinaCorrente = data[0];
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('nome-officina').innerText = officinaCorrente.nome_officina;
                    document.getElementById('crediti-residui').innerText = `${officinaCorrente.crediti} Sblocchi`;
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                } else {
                    localStorage.removeItem('rivenditore_token');
                }
            })
            .catch(err => console.error(err));
        }

        function handleLogin() {
            const token = document.getElementById('token-input').value.trim();
            if (!token) return;
            
            fetch(`${SUPABASE_URL}/rest/v1/rivenditori?access_token=eq.${token}`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    localStorage.setItem('rivenditore_token', token);
                    validaToken(token);
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            });
        }

        function handleLogout() {
            localStorage.removeItem('rivenditore_token');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('token-input').value = '';
        }

        // Selezione parametri Wizard
        function setMagnete(type) {
            selectedMagnet = type;
            document.getElementById('btn-magnete-raggi').className = type === 'raggi' ? "bg-cyan-500 text-slate-950 p-4 rounded-xl font-bold text-sm text-center transition" : "glass-panel border border-gray-800 p-4 rounded-xl font-bold text-sm text-center transition";
            document.getElementById('btn-magnete-valvola').className = type === 'valvola' ? "bg-cyan-500 text-slate-950 p-4 rounded-xl font-bold text-sm text-center transition" : "glass-panel border border-gray-800 p-4 rounded-xl font-bold text-sm text-center transition";
        }

        function setDisplay(type) {
            selectedDisplay = type;
            const buttons = {
                'Purion 200': 'btn-disp-purion',
                'Kiox 300/500': 'btn-disp-kiox',
                'Intuvia 100': 'btn-disp-intuvia',
                'LED Remote': 'btn-disp-led'
            };
            for (const [key, id] of Object.entries(buttons)) {
                document.getElementById(id).className = key === type ? "bg-cyan-500 text-slate-950 py-3 rounded-lg text-xs font-semibold text-center transition" : "glass-panel border border-gray-800 py-3 rounded-lg text-xs font-semibold text-center transition";
            }
        }

        function processCheck() {
            const fwInput = document.getElementById('fw-input').value.trim();
            const nomeCliente = document.getElementById('nome-cliente-input').value.trim();

            if (!nomeCliente || !selectedMagnet || !selectedDisplay || !fwInput) {
                alert("Per favore, compila tutti i campi richiesti.");
                return;
            }

            if (officinaCorrente.crediti <= 0) {
                alert("Errore: Crediti insufficienti. Ricarica il tuo account.");
                return;
            }

            const parts = fwInput.split('.').map(Number);
            const major = parts[0];
            const minor = parts[1];

            const resultBox = document.getElementById('check-result');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-description');
            
            resultBox.className = "p-6 rounded-xl border text-center space-y-4 ";
            let isCompatible = false;

            if (isNaN(major) || isNaN(minor)) {
                resultBox.classList.add("bg-red-500/10", "border-red-500/20");
                resultTitle.className = "text-xl font-bold text-red-400";
                resultTitle.innerText = "Format Error";
                resultDesc.innerText = "Inserisci un formato firmware valido (es: 15.24.2).";
            } else if (major < 19 || (major === 19 && minor <= 24)) {
                isCompatible = true;
                resultBox.classList.add("bg-emerald-500/10", "border-emerald-500/20");
                resultTitle.className = "text-xl font-bold text-emerald-400";
                resultTitle.innerText = "COMPATIBILE ✅";
                resultDesc.innerText = `La bici di ${nomeCliente} è compatibile. Abbiamo scalato 1 credito dal tuo saldo d'officina e inoltrato la richiesta a n8n. Riceverai la notifica di attivazione tra pochi istanti.`;
                
                // INVIA RICHIESTA A n8n
                fetch('https://n8n.rmstudio.app/webhook/velomotion-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome_cliente: nomeCliente,
                        magnete: selectedMagnet,
                        display: selectedDisplay,
                        firmware: fwInput,
                        rivenditore_id: officinaCorrente.id
                    })
                });
            } else {
                resultBox.classList.add("bg-amber-500/10", "border-amber-500/20");
                resultTitle.className = "text-xl font-bold text-amber-400";
                resultTitle.innerText = "NON SUPPORTATO ⚠️";
                resultDesc.innerText = "La versione firmware inserita è troppo recente per lo sblocco software. Contatta l'assistenza per informazioni.";
            }

            resultBox.classList.remove('hidden');
        }

        function resetCheck() {
            document.getElementById('check-result').classList.add('hidden');
            document.getElementById('nome-cliente-input').value = '';
            document.getElementById('fw-input').value = '';
            selectedMagnet = '';
            selectedDisplay = '';
            validaToken(localStorage.getItem('rivenditore_token')); // Ricarica crediti aggiornati
        }
    </script>
</body>
</html>
